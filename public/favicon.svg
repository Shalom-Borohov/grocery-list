    <path d="M592 505 L650 563 L724 447" fill="none" stroke="#14161a" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="272" y="453" width="250" height="44" rx="22" fill="#14161a"/>
    <rect x="352" y="525" width="170" height="32" rx="16" fill="#aab1ba"/>
