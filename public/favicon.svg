<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="icon-shape"><rect width="1024" height="1024" rx="229"/></clipPath>
    <linearGradient id="icon-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd94a"/>
      <stop offset="1" stop-color="#f2b900"/>
    </linearGradient>
    <filter id="soft-drop-shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
